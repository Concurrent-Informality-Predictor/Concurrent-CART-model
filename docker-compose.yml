version: "3"
services:
  nodo1:
    build: .
    ports:
      - "8081:8081"
    environment:
      - PORT=8081
      - REDIS_ADDR=redis:6379   
    depends_on:
      - redis
  nodo2:
    build: .
    ports:
      - "8082:8082"
    environment:
      - PORT=8082
      - REDIS_ADDR=redis:6379  
    depends_on:
      - redis
  nodo3:
    build: .
    ports:
      - "8083:8083"
    environment:
      - PORT=8083
      - REDIS_ADDR=redis:6379 
    depends_on:
      - redis
  redis:
    image: redis:latest
    ports:
      - "6379:6379"
